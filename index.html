<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Paused</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            animation: fadeIn 1s ease-in-out;
            color: #fff;
        }
        .container {
            text-align: center;
            background: rgba(255, 0, 0, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.5);
            animation: fadeIn 1s ease-in-out;
        }
        h1 {
            color: #ff4b5c;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff4b5c, 0 0 20px #ff4b5c, 0 0 30px #ff4b5c;
            animation: blink 1s infinite;
        }
        p {
            color: #ddd;
            font-size: 1.2em;
        }
        .contact {
            margin-top: 20px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #ff4b5c, #ff1e3c);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.3s ease, transform 0.3s ease;
            text-shadow: 0 0 5px #000;
        }
        .contact:hover {
            background: linear-gradient(135deg, #ff1e3c, #ff4b5c);
            transform: scale(1.1);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Service Paused</h1>
        <p>The domain for this service has expired.</p>
        <p>Please contact your developer for a solution.</p>
        <button class="contact" onclick="alert('Contact your developer at developer@example.com')">Contact Developer</button>
    </div>
</body>
</html>
